name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server — typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Lockfiles are not committed (see .gitignore), so the install is not frozen.
      # Install scripts are skipped: they patch the headless renderer, which
      # typechecking and unit tests do not need.
      - name: Install
        run: pnpm install --filter shine-server --no-frozen-lockfile --ignore-scripts
      # Media tests run real FFmpeg (the ffmpeg-static download is skipped above).
      - name: Install FFmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Typecheck
        run: pnpm --filter shine-server typecheck
      - name: Test
        run: pnpm --filter shine-server test

  client:
    name: Client — typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install --filter shine-client --no-frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm --filter shine-client typecheck
